name: Release

# CI release in two jobs. `build` signs both APK flavors (modern + compat; the
# signing key is injected from encrypted secrets at build time and wiped after)
# and uploads them as an artifact. `publish` runs behind the `release-approval`
# environment: the run pauses for a required reviewer to look at the built
# artifact and approve the deployment (approving is not publishing, so the
# release is authored by github-actions[bot], never a person). The reviewer and
# the environment are configured once by the owner in repo Settings, not here.
# The human gate to start a release is pushing the tag. Never draft: true, never
# the UI Publish button, never a PAT. Actions are pinned by commit SHA; the
# artifact up/download pair is kept in the same v4 era (upload v4.5.0 +
# download v4.3.0).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag/branch/commit to build'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Use the runner JDK (drop the local Studio java.home pin)
        working-directory: VDInfos
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Inject signing material
        env:
          KEYSTORE_B64: ${{ secrets.VDINFOS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VDINFOS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VDINFOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VDINFOS_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::VDINFOS_${v} secret is not set - cannot sign the release."
              exit 1
            fi
          done
          JKS="$GITHUB_WORKSPACE/VDInfos/vd-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$JKS"
          {
            echo "storeFile=$JKS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/VDInfos/keystore.properties"

      - name: Build release (both flavors)
        working-directory: VDInfos
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Wipe signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/VDInfos/keystore.properties" "$GITHUB_WORKSPACE/VDInfos/vd-release.jks"

      - name: Collect + verify APKs
        run: |
          mkdir -p dist
          cp VDInfos/app/build/outputs/apk/modern/release/*.apk dist/
          cp VDInfos/app/build/outputs/apk/compat/release/*.apk dist/
          ls -l dist/
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for a in dist/*.apk; do
            echo "== $a =="
            "$APKSIGNER" verify "$a"
            "$APKSIGNER" verify --print-certs "$a" | grep -iE 'certificate DN|Verified using v2|Verified using v3' || true
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: vdinfos-apks
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Owner-configured gate: required reviewer approves the deployment (not the
    # publish), so the release stays authored by github-actions[bot].
    environment: release-approval
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vdinfos-apks
          path: dist

      - name: Prepare release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v h="## [$VER]" 'index($0,h)==1{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then echo "See the commit history for the changes in this version." > body.md; fi
          printf '\n---\n\n📣 Join the channel for updates: @Priv8_VD https://t.me/Priv8_VD\n' >> body.md
          cat body.md

      - name: Publish release (bot-authored, no draft)
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          draft: false
          name: VD Infos ${{ github.ref_name }}
          body_path: body.md
          files: dist/*.apk
          fail_on_unmatched_files: true

      - name: Assert release author is github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ github.ref_name }}
        run: |
          author="$(gh release view "$VER" --json author -q '.author.login')"
          if [ "$author" != "github-actions[bot]" ]; then
            echo "::error::Release $VER was authored by '$author', not github-actions[bot] - auditability rule violated. The release step must use github.token, never a user PAT."
            exit 1
          fi
          echo "Release author verified: github-actions[bot]"
