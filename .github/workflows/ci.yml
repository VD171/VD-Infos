name: CI

# Fast pre-merge gate: Android lint on both flavors (modern + compat) and a
# JSON validity check over the shipped data files. Read-only, no secrets, no
# signing. The release is a separate workflow. Actions are pinned by commit SHA.

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Use the runner JDK (drop the local Studio java.home pin)
        working-directory: VDInfos
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Validate JSON data files
        run: |
          fail=0
          while IFS= read -r f; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(git ls-files '*.json' | grep -vE '/(build|\.gradle|\.idea)/')
          exit $fail

      - name: Android lint (both flavors)
        working-directory: VDInfos
        run: ./gradlew :app:lintModernRelease :app:lintCompatRelease --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: lint-reports
          path: VDInfos/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
