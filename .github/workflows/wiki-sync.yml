name: Wiki sync

# Mirror docs/ (plus the root CONTRIBUTING/CODE_OF_CONDUCT/SECURITY/CHANGELOG) into the
# GitHub project Wiki. docs/ is the source of truth; this renders the pages with
# gen_wiki.sh and pushes them into the separate VD-Google.wiki.git repo. The wiki must be
# initialized once (create any page in the web UI) before the first run.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'README.md'
      - '.github/workflows/wiki-sync.yml'
      - '.github/scripts/gen_wiki.sh'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror docs/ into the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          bash .github/scripts/gen_wiki.sh docs wiki
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
          else
            git commit -m "docs: sync from docs/ @ ${GITHUB_SHA}"
            git push
          fi
